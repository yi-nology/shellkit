<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="quick start: doctor, new, make test - three commands">
  <defs>
    <marker id="ah-q" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="300" rx="14" fill="#161b22" stroke="#2f3a48"/>

  <!-- 终端卡 1 -->
  <rect x="24" y="46" width="284" height="208" rx="10" fill="#0d1117" stroke="#2f3a48"/>
  <rect x="24" y="46" width="284" height="34" rx="10" fill="#1c2430"/>
  <rect x="24" y="70" width="284" height="10" fill="#1c2430"/>
  <circle cx="44" cy="63" r="5" fill="#ff5f56"/>
  <circle cx="62" cy="63" r="5" fill="#ffbd2e"/>
  <circle cx="80" cy="63" r="5" fill="#27c93f"/>
  <text x="98" y="68" font-size="13" fill="#9aa6b2">step 1</text>
  <text x="44" y="112" font-size="14" fill="#79c0ff">$ ./shellkit doctor</text>
  <text x="44" y="140" font-size="13" fill="#9aa6b2">bash   3.2.57 ok</text>
  <text x="44" y="164" font-size="13" fill="#9aa6b2">missing: shellcheck  (optional)</text>
  <text x="44" y="204" font-size="13" fill="#3fb950">exit 0</text>
  <text x="44" y="232" font-size="12" fill="#7d8894">gaps never block the core</text>

  <!-- 终端卡 2 -->
  <rect x="358" y="46" width="284" height="208" rx="10" fill="#0d1117" stroke="#2f3a48"/>
  <rect x="358" y="46" width="284" height="34" rx="10" fill="#1c2430"/>
  <rect x="358" y="70" width="284" height="10" fill="#1c2430"/>
  <circle cx="378" cy="63" r="5" fill="#ff5f56"/>
  <circle cx="396" cy="63" r="5" fill="#ffbd2e"/>
  <circle cx="414" cy="63" r="5" fill="#27c93f"/>
  <text x="432" y="68" font-size="13" fill="#9aa6b2">step 2</text>
  <text x="378" y="112" font-size="14" fill="#79c0ff">$ ./shellkit new /tmp/demo</text>
  <text x="378" y="140" font-size="13" fill="#9aa6b2">+ bin/  lib/  commands/</text>
  <text x="378" y="164" font-size="13" fill="#9aa6b2">+ tests/  Makefile  AGENTS.md</text>
  <text x="378" y="188" font-size="13" fill="#9aa6b2">+ vendor/shellkit/</text>
  <text x="378" y="232" font-size="12" fill="#7d8894">manifest-tracked, upgradeable</text>

  <!-- 终端卡 3 -->
  <rect x="692" y="46" width="284" height="208" rx="10" fill="#0d1117" stroke="#2f3a48"/>
  <rect x="692" y="46" width="284" height="34" rx="10" fill="#1c2430"/>
  <rect x="692" y="70" width="284" height="10" fill="#1c2430"/>
  <circle cx="712" cy="63" r="5" fill="#ff5f56"/>
  <circle cx="730" cy="63" r="5" fill="#ffbd2e"/>
  <circle cx="748" cy="63" r="5" fill="#27c93f"/>
  <text x="766" y="68" font-size="13" fill="#9aa6b2">step 3</text>
  <text x="712" y="112" font-size="14" fill="#79c0ff">$ cd /tmp/demo &amp;&amp; make test</text>
  <text x="712" y="140" font-size="13" fill="#9aa6b2">PASS  test_smoke.sh</text>
  <text x="712" y="164" font-size="13" fill="#9aa6b2">PASS  test_cli.sh</text>
  <text x="712" y="204" font-size="13" fill="#3fb950">ok, 0 failures</text>
  <text x="712" y="232" font-size="12" fill="#7d8894">the real binary, not a mock</text>

  <!-- 箭头 -->
  <line x1="312" y1="150" x2="352" y2="150" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#ah-q)"/>
  <line x1="646" y1="150" x2="686" y2="150" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#ah-q)"/>

  <text x="500" y="284" font-size="14" text-anchor="middle" fill="#9aa6b2">three commands, five minutes, nothing installed outside the target dir</text>
</svg>
