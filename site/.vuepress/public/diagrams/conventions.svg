<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 476" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="five hard rules: data channel, printf -v, atomic write, exit codes, never touch your shell">
  <defs>
    <marker id="ah-c1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/>
    </marker>
    <marker id="ah-c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a371f7"/>
    </marker>
    <marker id="ah-c3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="476" rx="14" fill="#161b22" stroke="#2f3a48"/>

  <!-- 象限 1：stdout/stderr 分流 -->
  <rect x="24" y="30" width="456" height="180" rx="10" fill="#1c2430" stroke="#232c38"/>
  <text x="44" y="60" font-size="14" font-weight="700" fill="#58a6ff">1) stdout = data, stderr = log</text>
  <text x="44" y="94" font-size="14" fill="#e6edf3">v=$(conf_get KEY)</text>
  <line x1="240" y1="89" x2="266" y2="89" stroke="#58a6ff" stroke-width="2" marker-end="url(#ah-c1)"/>
  <rect x="274" y="70" width="186" height="34" rx="6" fill="#0d1117" stroke="#58a6ff"/>
  <text x="286" y="92" font-size="13" fill="#79c0ff">stdout: the value</text>
  <text x="44" y="144" font-size="14" fill="#e6edf3">log_info "loading"</text>
  <line x1="240" y1="139" x2="266" y2="139" stroke="#7d8894" stroke-width="2" marker-end="url(#ah-c1)"/>
  <rect x="274" y="120" width="186" height="34" rx="6" fill="#0d1117" stroke="#2f3a48"/>
  <text x="286" y="142" font-size="13" fill="#9aa6b2">stderr: [INFO] ...</text>
  <text x="44" y="190" font-size="13" fill="#3fb950">$(...) is never polluted</text>

  <!-- 象限 2：printf -v 出参链 -->
  <rect x="520" y="30" width="456" height="180" rx="10" fill="#1c2430" stroke="#232c38"/>
  <text x="540" y="60" font-size="14" font-weight="700" fill="#a371f7">2) output via printf -v (no nameref in 3.2)</text>
  <rect x="544" y="96" width="110" height="60" rx="8" fill="#0d1117" stroke="#a371f7"/>
  <text x="566" y="132" font-size="14" fill="#e6edf3">fn()</text>
  <rect x="736" y="96" width="212" height="60" rx="8" fill="#0d1117" stroke="#58a6ff"/>
  <text x="752" y="122" font-size="13" fill="#79c0ff">caller scope</text>
  <text x="752" y="146" font-size="14" fill="#e6edf3">$out = "value"</text>
  <line x1="660" y1="116" x2="730" y2="116" stroke="#a371f7" stroke-width="2" marker-end="url(#ah-c2)"/>
  <text x="695" y="106" font-size="12" text-anchor="middle" fill="#a371f7">printf -v</text>
  <text x="544" y="190" font-size="13" fill="#9aa6b2">the function never writes your variables directly</text>

  <!-- 象限 3：原子写 -->
  <rect x="24" y="242" width="456" height="164" rx="10" fill="#1c2430" stroke="#232c38"/>
  <text x="44" y="272" font-size="14" font-weight="700" fill="#58a6ff">4) every write is atomic</text>
  <rect x="48" y="300" width="118" height="36" rx="8" fill="#0d1117" stroke="#2f3a48"/>
  <text x="64" y="323" font-size="13" fill="#e6edf3">tmp file</text>
  <line x1="172" y1="318" x2="200" y2="318" stroke="#58a6ff" stroke-width="2" marker-end="url(#ah-c1)"/>
  <rect x="208" y="300" width="86" height="36" rx="8" fill="#0d1117" stroke="#58a6ff"/>
  <text x="224" y="323" font-size="13" fill="#79c0ff">mv -f</text>
  <line x1="300" y1="318" x2="328" y2="318" stroke="#3fb950" stroke-width="2" marker-end="url(#ah-c3)"/>
  <rect x="336" y="300" width="120" height="36" rx="8" fill="#0d1117" stroke="#3fb950"/>
  <text x="352" y="323" font-size="13" fill="#3fb950">target &#10003;</text>
  <text x="44" y="374" font-size="13" fill="#9aa6b2">killed mid-write: a stray tmp, never a half file</text>
  <text x="44" y="394" font-size="13" fill="#9aa6b2">backup rotation and idempotent edits ride along</text>

  <!-- 象限 4：退出码 -->
  <rect x="520" y="242" width="456" height="164" rx="10" fill="#1c2430" stroke="#232c38"/>
  <text x="540" y="272" font-size="14" font-weight="700" fill="#a371f7">exit codes are the interface</text>
  <g font-size="13" text-anchor="middle">
    <rect x="544" y="300" width="62" height="40" rx="14" fill="#0d1117" stroke="#3fb950"/>
    <text x="575" y="318" fill="#3fb950">0</text>
    <text x="575" y="336" font-size="11" fill="#9aa6b2">ok</text>
    <rect x="614" y="300" width="62" height="40" rx="14" fill="#0d1117" stroke="#58a6ff"/>
    <text x="645" y="318" fill="#79c0ff">1</text>
    <text x="645" y="336" font-size="11" fill="#9aa6b2">error</text>
    <rect x="684" y="300" width="62" height="40" rx="14" fill="#0d1117" stroke="#58a6ff"/>
    <text x="715" y="318" fill="#79c0ff">2</text>
    <text x="715" y="336" font-size="11" fill="#9aa6b2">usage</text>
    <rect x="754" y="300" width="62" height="40" rx="14" fill="#0d1117" stroke="#58a6ff"/>
    <text x="785" y="318" fill="#79c0ff">3</text>
    <text x="785" y="336" font-size="11" fill="#9aa6b2">precond</text>
    <rect x="824" y="300" width="62" height="40" rx="14" fill="#0d1117" stroke="#58a6ff"/>
    <text x="855" y="318" fill="#79c0ff">4</text>
    <text x="855" y="336" font-size="11" fill="#9aa6b2">net</text>
    <rect x="894" y="300" width="62" height="40" rx="14" fill="#0d1117" stroke="#d29922"/>
    <text x="925" y="318" fill="#e3b341">5</text>
    <text x="925" y="336" font-size="11" fill="#9aa6b2">verify</text>
  </g>
  <text x="540" y="380" font-size="13" fill="#9aa6b2">callers decide retry / abort from the code,</text>
  <text x="540" y="400" font-size="13" fill="#9aa6b2">never by grepping output</text>

  <!-- 底部：第 5 条 -->
  <rect x="24" y="426" width="952" height="36" rx="8" fill="#151b23" stroke="#232c38"/>
  <text x="44" y="450" font-size="14" fill="#9aa6b2">5) the library never changes your shell options (set -euo pipefail is yours) and never changes cwd</text>
</svg>
