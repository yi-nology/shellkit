name: tmp-ci-cleanup

# 最后一版清理工装。
#
# main 已由 PR #155（merge commit edaaefaa）清干净：4 个临时工装文件已删、
# .github/workflows 只剩 ci/packages/pages/release 四个正式文件。
#
# 这一版只做三件事：
#   ① 关掉 PR #156 —— 它的 diff 是把 6 个临时工装文件**加回** main
#      （.github/workflows/tmp-ci-cleanup.yml、tmp-ci-helper.yml、
#       cleanup-pr-body.md、issue-close.md、pr-body.md、probe-openeuler.sh），
#      与 PR #155 正好相反 ⇒ 合并它等于把污染放回去；
#   ② 核对 main 的终态（临时文件确实不在、workflow 目录只剩正式文件）；
#   ③ 把日志发到 tmp/ci-cleanup-log。
#
# 这一版**不再创建任何 PR**：清理已经由 PR #155 完成。
# tmp/ci-cleanup 与 tmp/ci-cleanup-log 跑完后手工删（workflow 不能删自己）。

on:
  push:
    branches:
      - tmp/ci-cleanup

permissions:
  actions: write
  checks: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: tmp-ci-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    name: close the pollution PR and verify the main tree
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: close the PR that would put the temporary artifacts back into main
        run: |
          set +e
          set -uo pipefail
          echo "== close pollution PRs ==" > /tmp/cleanup.log
          for pr in $(gh pr list --state open --json number,headRefName --jq ".[] | select(.headRefName == \"tmp/ci-cleanup\") | .number" 2>/dev/null); do
            gh pr close "$pr" --comment "这个 PR 会把临时 CI 工装（tmp-ci-helper.yml / tmp-ci-cleanup.yml / issue-close.md / pr-body.md / cleanup-pr-body.md / probe-openeuler.sh）**加回** main —— 与 PR #155 正好相反。main 已经在 PR #155（merge commit edaaefaa）里清干净了，所以这里关掉而不是合并。临时工装只放 tmp/* 分支，合并进 main 就成了常驻的自动推分支/开 PR 的 workflow。" >> /tmp/cleanup.log 2>&1
            echo "closed PR $pr rc=$?" >> /tmp/cleanup.log
          done
          echo "open PRs after close:" >> /tmp/cleanup.log
          gh pr list --state open --json number,title >> /tmp/cleanup.log 2>&1
          exit 0

      - name: checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: repo
          fetch-depth: 0

      - name: verify the main tree no longer carries the temporary artifacts
        run: |
          set +e
          set -uo pipefail
          cd repo
          git fetch -q origin main
          for f in .github/workflows/tmp-ci-helper.yml .github/workflows/tmp-ci-cleanup.yml issue-close.md pr-body.md cleanup-pr-body.md probe-openeuler.sh; do
            if git cat-file -e "origin/main:$f" 2>/dev/null; then
              echo "FAIL: $f still in main" >> /tmp/cleanup.log
            else
              echo "ok: $f not in main" >> /tmp/cleanup.log
            fi
          done
          echo "workflows in main:" >> /tmp/cleanup.log
          git ls-tree --name-only origin/main .github/workflows/ >> /tmp/cleanup.log 2>&1
          echo "main head:" >> /tmp/cleanup.log
          git log --oneline -3 origin/main >> /tmp/cleanup.log 2>&1
          exit 0

      - name: publish the log (always)
        if: always()
        run: |
          set +e
          set -uo pipefail
          cd repo
          git worktree add -f /tmp/cleanwt -B tmp/ci-cleanup-log origin/main >> /tmp/cleanup.log 2>&1
          if [ -d /tmp/cleanwt ]; then
            cp /tmp/cleanup.log /tmp/cleanwt/cleanup-log.txt 2>/dev/null
            cd /tmp/cleanwt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cleanup-log.txt 2>/dev/null
            git commit -q -m "log: final cleanup run" 2>/dev/null
            git push -f origin "HEAD:tmp/ci-cleanup-log" >> /tmp/cleanup.log 2>&1
          fi
          exit 0
