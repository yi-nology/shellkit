name: release

# 发版四段：Build → Quality Gate → Artifact Verification → Publish。
#
# 旧实现是「tag 一推就发布」：release.yml 与 ci.yml 之间没有任何依赖，
# CI 没跑、跑了但失败、或者还在跑，release 照发（issue #42）。而且 GitHub
# 的一个事实是：**从 tag 触发的工作流不会自动等另一个工作流** —— 所以
# 第一段在发布动作之前主动查询「被 tag 的那个 SHA」的 check-runs：
# 全部必需检查（ci.yml 的六个 job）都 success 才进下一段；缺席、未完成、
# 失败，一律不产生 Release。
#
# quality-gate 的判据在 tools/release_gate.sh（有 stub 回归
# tests/test_release_gate.sh）；必需检查的清单也声明在那里 —— ci.yml
# 加删 job 要同步改它。这与本地 `make release`（tools/release.sh 的
# make check）是同一口径：本地门禁与 CI 门禁都绿，才发布。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  quality-gate:
    name: quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: wait for the required checks of the tagged SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash tools/release_gate.sh "$GITHUB_SHA" --timeout 2400 --interval 30

  release:
    name: build, verify and publish
    needs: [quality-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: tag matches VERSION
        run: |
          version=$(cat VERSION)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION $version" >&2
            exit 1
          fi

      - name: build tarball
        run: |
          set -euo pipefail
          # 打包清单只在 tools/package_tarball.sh 里维护一份，release.yml 与
          # packages.yml 共用它 —— 内联两份 cp 清单必然漂移（issue #65）。
          # 「少拷一个目录 smoke 才炸」的教训与逐项点名的清单都在那个脚本里。
          bash tools/package_tarball.sh
          cat dist/SHA256SUMS

      - name: smoke test the artifact
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          # skill 包必须能独立解开：装进 AI 客户端的就是它。
          # 缺 references/ 的残包 AI 会照着残缺的内容写代码 —— 用户看不出区别。
          skillpkg="dist/shellkit-skill-$version.tar.gz"
          if [ ! -f "$skillpkg" ]; then
            echo "the release is missing $skillpkg" >&2
            exit 1
          fi
          skillwork=$(mktemp -d)
          tar -C "$skillwork" -xzf "$skillpkg"
          for f in shellkit/SKILL.md shellkit/references/reference.md shellkit/references/cli.md; do
            if [ ! -s "$skillwork/$f" ]; then
              echo "the skill package is missing $f" >&2
              exit 1
            fi
          done
          work=$(mktemp -d)
          tar -C "$work" -xzf "dist/shellkit-$version.tar.gz"
          cd "$work/shellkit-$version"
          # 许可文件必须随包走：MIT 要求版权声明随每一份副本分发，
          # NOTICE 里的上游署名同理。漏了不会有任何报错，只有收到律师函时才知道。
          for f in LICENSE NOTICE; do
            if [ ! -s "$f" ]; then
              echo "the release tarball is missing $f" >&2
              exit 1
            fi
          done
          # 打包清单必须逐项点名：少拷一个目录，smoke test 要到几百行之后
          # 才会以「command not found / 127」的形式炸掉，看不出是打包漏了东西。
          # （v0.15.0 就是在这一步现原形：tests/ 漏了，报出来的是 127。）
          for f in shellkit \
                    install.sh \
                    repair.sh \
                    demo.sh \
                    lib/bootstrap.sh \
                    templates \
                    locale/shellkit.pot \
                    po/messages.sh \
                    tests/run.sh \
                    tests/test_helper.sh \
                    docs/MIGRATING.md \
                    skills/shellkit/SKILL.md \
                    skills/shellkit/references/reference.md \
                    README.md \
                    AGENTS.md \
                    VERSION
          do
            if [ ! -e "$f" ]; then
              echo "the release tarball is missing $f" >&2
              exit 1
            fi
          done
          # repair.sh 必须可执行：CLI 起不来时，它是唯一的恢复入口。
          # 漏打包 ⇒ 那台机器连自救的路都没有。
          if [ ! -x repair.sh ]; then
            echo "the release tarball is missing an executable repair.sh" >&2
            exit 1
          fi
          bash tests/run.sh
          ./shellkit doctor || true
          ./shellkit new "$work/demo" --cmd start
          ( cd "$work/demo" && make test )
          # demo 命令必须能用：它生成工程并跑工程自己的测试，跑的是真二进制。
          # demo.sh 走的是 release 资产（发布前拿不到），所以这里验的是包里的 CLI。
          ./shellkit demo "$work/demo2"

      # 签名是可选步骤（issue #66）：没配私钥时 sign_release.sh 明确提示并 0 退出，
      # 不挡发布；配了私钥却签不动（缺 minisign 等）才红 —— 那时就该红。
      - name: sign release assets (optional)
        env:
          SHELLKIT_MINISIGN_KEY: ${{ secrets.SHELLKIT_MINISIGN_KEY }}
          SHELLKIT_MINISIGN_PUBKEY: ${{ secrets.SHELLKIT_MINISIGN_PUBKEY }}
        run: bash tools/sign_release.sh --dist dist

      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # install.sh 也作为资产发布：releases/latest/download/install.sh 是稳定地址，
          # raw.githubusercontent.com 在部分地区不可达，网页上那条一行命令要能走 release。
          tag="$GITHUB_REF_NAME"
          assets=("dist/shellkit-$(cat VERSION).tar.gz" "dist/SHA256SUMS" "install.sh" "repair.sh" "demo.sh" "dist/shellkit-skill-$(cat VERSION).tar.gz")
          # 签名产物（没配私钥时这些文件不存在 —— 可选，缺了不挡发布）
          for f in "dist/shellkit-$(cat VERSION).tar.gz.minisig" \
                   "dist/shellkit-skill-$(cat VERSION).tar.gz.minisig" \
                   "dist/SHA256SUMS.minisig" \
                   "install.sh.minisig" \
                   "dist/shellkit.minisign.pub"; do
            if [ -f "$f" ]; then
              assets[${#assets[@]}]="$f"
            fi
          done
          if gh release view "$tag" >/dev/null 2>&1; then
            # 同一个 tag 被推了两次（比如先推轻量 tag、后来补推 annotated tag）时，
            # 直接发布会以「release 已存在」失败，把整条流水线染红 —— 而产物其实
            # 一模一样。这里走不可变上传（issue #87）：同摘要跳过、异摘要拒绝
            # 覆盖并要求人工处理 —— 以前 --clobber 会静默替换同一版本的
            # 下载内容，防不了发布账号被攻破后的整体替换。
            echo "release $tag already exists; enforcing asset immutability"
            bash tools/release_assets.sh "$tag" "${assets[@]}"
          else
            gh release create "$tag" "${assets[@]}" \
              --title "shellkit $(cat VERSION)" \
              --generate-notes
          fi

  # deb / rpm（issue #65）：基于**已发布**的那份 tarball 打包 —— 下载 release
  # 资产并对 SHA256SUMS，确保包的是「发出去的那份」，不是本地重建的第二份。
  #
  # 可选 job：continue-on-error + 不被任何 job 依赖 ⇒ 挂了不挡 release，
  # 这是验收明写的要求（包还没进主线发版必须物）。同一套脚本在 packages.yml
  # 里于 PR/推送阶段先跑，这里的失败当信号看，不改发布结论。
  packages:
    name: deb/rpm packages (optional)
    needs: release
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: download the published tarball (the single source of truth)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ver=$(cat VERSION)
          mkdir -p dist
          gh release download "$GITHUB_REF_NAME" --dir dist --clobber \
            --pattern "shellkit-$ver.tar.gz" --pattern SHA256SUMS
          # 下载的东西先对校验和，再拿去打包
          expect=$(awk -v n="shellkit-$ver.tar.gz" '$2==n{print $1}' dist/SHA256SUMS)
          [ -n "$expect" ] || { echo "no checksum for shellkit-$ver.tar.gz in SHA256SUMS" >&2; exit 1; }
          actual=$(sha256sum "dist/shellkit-$ver.tar.gz" | awk '{print $1}')
          [ "$expect" = "$actual" ] || { echo "checksum mismatch: expected $expect, got $actual" >&2; exit 1; }
          echo "tarball verified: $actual"

      - name: build deb and smoke it (install, run, remove)
        run: |
          set -euo pipefail
          ver=$(cat VERSION)
          bash tools/package_syspkg.sh --tarball "dist/shellkit-$ver.tar.gz" --out dist deb
          bash tools/package_smoke.sh --tarball "dist/shellkit-$ver.tar.gz" "dist/shellkit-$ver.deb"

      - name: build rpm and smoke it (install, run, remove)
        run: |
          set -euo pipefail
          ver=$(cat VERSION)
          # Ubuntu 上 rpmbuild 由 rpm 包提供
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm
          bash tools/package_syspkg.sh --tarball "dist/shellkit-$ver.tar.gz" --out dist rpm
          bash tools/package_smoke.sh --tarball "dist/shellkit-$ver.tar.gz" "dist/shellkit-$ver.rpm"

      - name: attach packages to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ver=$(cat VERSION)
          # 不可变上传（issue #87）：同摘要跳过、异摘要拒绝覆盖并要求人工处理
          bash tools/release_assets.sh "$GITHUB_REF_NAME" \
            "dist/shellkit-$ver.deb" "dist/shellkit-$ver.rpm"
