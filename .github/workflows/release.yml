name: release

# 发版四段：Build → Quality Gate → Artifact Verification → Publish。
#
# 旧实现是「tag 一推就发布」：release.yml 与 ci.yml 之间没有任何依赖，
# CI 没跑、跑了但失败、或者还在跑，release 照发（issue #42）。而且 GitHub
# 的一个事实是：**从 tag 触发的工作流不会自动等另一个工作流** —— 所以
# 第一段在发布动作之前主动查询「被 tag 的那个 SHA」的 check-runs：
# 全部必需检查（ci.yml 的六个 job）都 success 才进下一段；缺席、未完成、
# 失败，一律不产生 Release。
#
# quality-gate 的判据在 tools/release_gate.sh（有 stub 回归
# tests/test_release_gate.sh）；必需检查的清单也声明在那里 —— ci.yml
# 加删 job 要同步改它。这与本地 `make release`（tools/release.sh 的
# make check）是同一口径：本地门禁与 CI 门禁都绿，才发布。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  quality-gate:
    name: quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: wait for the required checks of the tagged SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash tools/release_gate.sh "$GITHUB_SHA" --timeout 2400 --interval 30

  release:
    name: build, verify and publish
    needs: [quality-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: tag matches VERSION
        run: |
          version=$(cat VERSION)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION $version" >&2
            exit 1
          fi

      - name: build tarball
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          name="shellkit-$version"
          mkdir -p "dist/$name"
          # 只放跑起来需要的东西：生成器、库、模板、语言包、文档、测试
          # 少拷一个目录，smoke test 要到几百行之后才会以 127 的形式炸掉 ——
          # 0.13.0 漏了 CHANGELOG、v0.15.0 漏了 tests/，两次都是这么红的。
          cp -R shellkit install.sh repair.sh demo.sh lib templates locale po tools tests docs skills examples "dist/$name/"
          cp README.md AGENTS.md VERSION LICENSE NOTICE Makefile CHANGELOG.md "dist/$name/"
          rm -rf "dist/$name/docs/superpowers"
          chmod +x "dist/$name/shellkit" "dist/$name/install.sh" "dist/$name/repair.sh" "dist/$name/demo.sh"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          # skill 包单独打一个 tarball：装进 AI 客户端的就是这个目录
          # （SKILL.md + references/）。混在主包里的话，用户得自己拆目录，
          # 还得知道 references/ 是什么 —— 「装一下」的门槛不该这么高。
          rm -rf "dist/skill"
          mkdir -p "dist/skill"
          cp -R skills/shellkit "dist/skill/shellkit"
          tar -C dist/skill -czf "dist/shellkit-skill-$version.tar.gz" shellkit
          ( cd dist && sha256sum "$name.tar.gz" "shellkit-skill-$version.tar.gz" > SHA256SUMS )
          cat dist/SHA256SUMS

      - name: smoke test the artifact
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          # skill 包必须能独立解开：装进 AI 客户端的就是它。
          # 缺 references/ 的残包 AI 会照着残缺的内容写代码 —— 用户看不出区别。
          skillpkg="dist/shellkit-skill-$version.tar.gz"
          if [ ! -f "$skillpkg" ]; then
            echo "the release is missing $skillpkg" >&2
            exit 1
          fi
          skillwork=$(mktemp -d)
          tar -C "$skillwork" -xzf "$skillpkg"
          for f in shellkit/SKILL.md shellkit/references/reference.md shellkit/references/cli.md; do
            if [ ! -s "$skillwork/$f" ]; then
              echo "the skill package is missing $f" >&2
              exit 1
            fi
          done
          work=$(mktemp -d)
          tar -C "$work" -xzf "dist/shellkit-$version.tar.gz"
          cd "$work/shellkit-$version"
          # 许可文件必须随包走：MIT 要求版权声明随每一份副本分发，
          # NOTICE 里的上游署名同理。漏了不会有任何报错，只有收到律师函时才知道。
          for f in LICENSE NOTICE; do
            if [ ! -s "$f" ]; then
              echo "the release tarball is missing $f" >&2
              exit 1
            fi
          done
          # 打包清单必须逐项点名：少拷一个目录，smoke test 要到几百行之后
          # 才会以「command not found / 127」的形式炸掉，看不出是打包漏了东西。
          # （v0.15.0 就是在这一步现原形：tests/ 漏了，报出来的是 127。）
          for f in shellkit \
                    install.sh \
                    repair.sh \
                    demo.sh \
                    lib/bootstrap.sh \
                    templates \
                    locale/shellkit.pot \
                    po/messages.sh \
                    tests/run.sh \
                    tests/test_helper.sh \
                    docs/MIGRATING.md \
                    skills/shellkit/SKILL.md \
                    skills/shellkit/references/reference.md \
                    README.md \
                    AGENTS.md \
                    VERSION
          do
            if [ ! -e "$f" ]; then
              echo "the release tarball is missing $f" >&2
              exit 1
            fi
          done
          # repair.sh 必须可执行：CLI 起不来时，它是唯一的恢复入口。
          # 漏打包 ⇒ 那台机器连自救的路都没有。
          if [ ! -x repair.sh ]; then
            echo "the release tarball is missing an executable repair.sh" >&2
            exit 1
          fi
          bash tests/run.sh
          ./shellkit doctor || true
          ./shellkit new "$work/demo" --cmd start
          ( cd "$work/demo" && make test )
          # demo 命令必须能用：它生成工程并跑工程自己的测试，跑的是真二进制。
          # demo.sh 走的是 release 资产（发布前拿不到），所以这里验的是包里的 CLI。
          ./shellkit demo "$work/demo2"

      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # install.sh 也作为资产发布：releases/latest/download/install.sh 是稳定地址，
          # raw.githubusercontent.com 在部分地区不可达，网页上那条一行命令要能走 release。
          tag="$GITHUB_REF_NAME"
          assets=("dist/shellkit-$(cat VERSION).tar.gz" "dist/SHA256SUMS" "install.sh" "repair.sh" "demo.sh" "dist/shellkit-skill-$(cat VERSION).tar.gz")
          if gh release view "$tag" >/dev/null 2>&1; then
            # 同一个 tag 被推了两次（比如先推轻量 tag、后来补推 annotated tag）时，
            # 直接发布会以「release 已存在」失败，把整条流水线染红 —— 而产物其实
            # 一模一样。这里改成刷新资产，幂等。
            echo "release $tag already exists; refreshing its assets"
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --title "shellkit $(cat VERSION)" \
              --generate-notes
          fi
