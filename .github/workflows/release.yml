name: release

# 打 tag 即发版：构建 tarball、生成校验和、先自检再发布。
# 产物是这个库唯一的「安装包」形态 —— 解包即用，不需要 git。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: tag matches VERSION
        run: |
          version=$(cat VERSION)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION $version" >&2
            exit 1
          fi

      - name: build tarball
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          name="shellkit-$version"
          mkdir -p "dist/$name"
          # 只放跑起来需要的东西：生成器、库、模板、语言包、文档、测试
          cp -R shellkit install.sh lib templates locale po tools tests docs skills examples "dist/$name/"
          # CHANGELOG 必须随包走：tests/ 里有会读它的用例（test_versions_gate.sh），
          # 漏了它打包后的 smoke test 会红 —— 0.13.0 的 release 就是这么失败的。
          cp README.md AGENTS.md VERSION LICENSE NOTICE Makefile CHANGELOG.md "dist/$name/"
          rm -rf "dist/$name/docs/superpowers"
          chmod +x "dist/$name/shellkit" "dist/$name/install.sh"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ( cd dist && sha256sum "$name.tar.gz" > SHA256SUMS )
          cat dist/SHA256SUMS

      - name: smoke test the artifact
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          work=$(mktemp -d)
          tar -C "$work" -xzf "dist/shellkit-$version.tar.gz"
          cd "$work/shellkit-$version"
          # 许可文件必须随包走：MIT 要求版权声明随每一份副本分发，
          # NOTICE 里的上游署名同理。漏了不会有任何报错，只有收到律师函时才知道。
          for f in LICENSE NOTICE; do
            if [ ! -s "$f" ]; then
              echo "the release tarball is missing $f" >&2
              exit 1
            fi
          done
          bash tests/run.sh
          ./shellkit doctor || true
          ./shellkit new "$work/demo" --cmd start
          ( cd "$work/demo" && make test )

      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # install.sh 也作为资产发布：releases/latest/download/install.sh 是稳定地址，
          # raw.githubusercontent.com 在部分地区不可达，网页上那条一行命令要能走 release。
          tag="$GITHUB_REF_NAME"
          assets=("dist/shellkit-$(cat VERSION).tar.gz" "dist/SHA256SUMS" "install.sh")
          if gh release view "$tag" >/dev/null 2>&1; then
            # 同一个 tag 被推了两次（比如先推轻量 tag、后来补推 annotated tag）时，
            # 直接发布会以「release 已存在」失败，把整条流水线染红 —— 而产物其实
            # 一模一样。这里改成刷新资产，幂等。
            echo "release $tag already exists; refreshing its assets"
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --title "shellkit $(cat VERSION)" \
              --generate-notes
          fi
