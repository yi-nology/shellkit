name: quality

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          # macOS 的 /bin/bash 就是 3.2，基线只有这里能真正验证
          - macos-latest
          - ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash version
        run: bash --version | head -1

      # Linux 上补 gettext 与 zh_CN locale，让 i18n 的「真实查表」路径也被跑到
      - name: extra tooling
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck gettext locales
          sudo sed -i 's/^# *zh_CN.UTF-8 UTF-8/zh_CN.UTF-8 UTF-8/' /etc/locale.gen
          sudo locale-gen zh_CN.UTF-8
          locale -a | grep -i zh_CN

      # macOS runner 没有 go，装了也白装；Linux 上装真 shfmt，别让格式检查静默跳过
      - name: shfmt
        if: runner.os == 'Linux'
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: syntax
        run: make syntax

      - name: test
        run: make test

      - name: shellcheck
        if: runner.os == 'Linux'
        run: make lint

      # 生成物（REFERENCE / AGENTS / 模板 AGENTS / SKILL）必须与源码一致
      - name: docs check
        run: make docs-check

      # 文档里的代码块要真能跑、函数名要真实存在
      - name: docs snippets
        run: make check-docs

      # pot 与源码漂移过（头里还写着 0.3.0 而 VERSION 早就是 0.4.x）
      - name: message catalogue
        run: make messages-check

      - name: examples
        run: make examples

      - name: format
        run: make fmt
