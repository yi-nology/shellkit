name: quality

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          # macOS 的 /bin/bash 就是 3.2，基线只有这里能真正验证
          - macos-latest
          - ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash version
        run: bash --version | head -1

      - name: syntax
        run: make syntax

      - name: test
        run: make test

      - name: shellcheck
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          make lint
