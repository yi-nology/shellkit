name: quality

on:
  push:
    branches:
      - main
  pull_request:

# 工具版本全部钉死。
# 发行版仓库里的 shellcheck / gettext 会随时间变 —— 那不是「同一份门禁」，
# 而是「每次跑都可能不一样的门禁」。这里统一从官方 release 取钉死的版本。
env:
  SHELLCHECK_VERSION: v0.11.0
  SHFMT_VERSION: v3.14.1
  BATS_VERSION: v1.14.0

jobs:
  test:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          # macOS 的 /bin/bash 就是 3.2，基线只有这里能真正验证
          - macos-latest
          - macos-15
          - ubuntu-latest
          - ubuntu-22.04
          # 原生 ARM64 Linux —— 国产系统与 ARM64 服务器的真实目标环境。
          # 公共仓库免费提供（2025 年起），标签见 GitHub 官方文档。
          - ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: bash version
        run: bash --version | head -1

      - name: install pinned tools
        run: |
          set -euo pipefail
          sudo=""
          if command -v sudo >/dev/null 2>&1; then sudo="sudo"; fi
          mkdir -p "$HOME/.local/bin"
          case "$(uname -m)" in
            arm64 | aarch64) arch=aarch64 ;;
            *) arch=x86_64 ;;
          esac
          if [ "$(uname -s)" = "Darwin" ]; then
            sc="shellcheck-${SHELLCHECK_VERSION}.darwin.${arch}.tar.xz"
          else
            sc="shellcheck-${SHELLCHECK_VERSION}.linux.${arch}.tar.xz"
          fi
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${sc}" -o /tmp/sc.tar.xz
          tar -xJf /tmp/sc.tar.xz -C /tmp
          install -m 0755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" "$HOME/.local/bin/shellcheck"
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64) sf="shfmt_${SHFMT_VERSION}_darwin_arm64" ;;
            Darwin-*) sf="shfmt_${SHFMT_VERSION}_darwin_amd64" ;;
            Linux-aarch64) sf="shfmt_${SHFMT_VERSION}_linux_arm64" ;;
            *) sf="shfmt_${SHFMT_VERSION}_linux_amd64" ;;
          esac
          curl -fsSL "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/${sf}" -o "$HOME/.local/bin/shfmt"
          chmod 0755 "$HOME/.local/bin/shfmt"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Linux 上补 gettext 与 zh_CN locale，让 i18n 的「真实查表」路径也被跑到
      - name: extra tooling
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext locales
          sudo sed -i 's/^# *zh_CN.UTF-8 UTF-8/zh_CN.UTF-8 UTF-8/' /etc/locale.gen
          sudo locale-gen zh_CN.UTF-8
          locale -a | grep -i zh_CN

      # 门禁只维护一份：本地 make check 与 CI 跑的是同一组检查。
      # macOS 显式指定 /bin/bash —— PATH 上可能有别的 bash，那样就验不到 3.2 基线了。
      - name: gate
        run: |
          set -euo pipefail
          if [ "$(uname -s)" = "Darwin" ]; then
            make check BASH=/bin/bash
          else
            make check
          fi

  # 发行版兼容矩阵：在容器里跑同一组门禁。
  # Ubuntu/macOS 之外再验 Debian 与 Rocky —— shellkit 的目标用户正是这类机器。
  compat:
    name: compat on ${{ matrix.image }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    # 有限超时（issue #136）：openeuler job 曾卡 30+ 分钟不结束。慢可以解释、
    # 卡死不行——超时把「等一个永远不会结束的 job」变成一条明确的失败信号。
    # 取 40 分钟：实测 openeuler 完整一轮约 6 分钟（本地容器），但共享 runner
    # 的包下载/CPU 波动可能到 20+ 分钟；超时只该杀「卡死」，不该杀「慢」。
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            runner: ubuntu-latest
          - image: rockylinux:9
            runner: ubuntu-latest
          # 欧拉（openEuler）—— 国产系统里唯一有公开可拉取镜像的发行版。
          # 麒麟的官方镜像在 docker.kylinos.cn（要鉴权），CI 拉不动，
          # 所以「国产系统」这条线用欧拉代表，麒麟靠发行版识别用例 + 手工验证。
          - image: openeuler/openeuler:24.03-lts
            runner: ubuntu-latest
          # 国产系统 × ARM64：跑在 ARM64 runner 上，容器也是原生 arm64
          # （openEuler 的镜像同时有 amd64 与 arm64 变体）。
          - image: openeuler/openeuler:24.03-lts
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # 容器 job 的 run 步骤由 runner 用 `docker exec ... <shell>` 启动。
      # 显式写 shell: bash 时，镜像里没有 bash 会在 **exec 阶段**直接失败
      # （exit 127，issue #136 的现场）。这里先用 sh 跑一步（容器 job 的默认
      # shell，镜像必须提供），把 bash 装好并打印解析结果；后续步骤显式用
      # `$(command -v bash)`，不再赌 runner 的 exec 查找。
      - name: ensure bash
        shell: sh
        run: |
          set -eu
          if ! command -v bash >/dev/null 2>&1; then
            if command -v dnf >/dev/null 2>&1; then
              dnf install -y bash
            elif command -v microdnf >/dev/null 2>&1; then
              microdnf install -y bash
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update -qq
              apt-get install -y -qq bash
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache bash
            else
              echo 'bash is missing and no supported package manager is available' >&2
              exit 1
            fi
          fi
          command -v bash
          bash --version | head -1

      - name: install tooling
        # POSIX sh：容器 job 默认 shell 就是 sh，不写 shell: bash 就不会在
        # exec 阶段因 bash 缺失而 127（issue #136）。本脚本保持 POSIX 兼容，
        # 不用 set -o pipefail（dash 会把它当非法选项）。
        shell: sh
        run: |
          set -eu
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq
            # python3：tests/test_doctor.sh 的 JSON 值断言靠它解析（jget/jlen）；
            # git：check_security 的 secret.tracked 判据要用它（缺 git 会明确报
            # 「这条判据查不了」并让门禁变红），同时让容器走 git archive 的
            # 正常副本路径。
            apt-get install -y -qq gettext ca-certificates curl tar xz-utils make python3 git bash
          else
            # Rocky 9 基础镜像自带 curl-minimal，它和同名 curl 包互斥：
            # 硬装 curl 会报 "curl-minimal ... conflicts with curl"。
            # curl-minimal 已经能下载文件（-fsSL 都支持），所以这里不装 curl，
            # 只补真正缺的包；下载器在下面统一兜底。
            dnf install -y -qq --allowerasing \
              bash gettext ca-certificates tar xz make python3 git \
              grep sed gawk findutils diffutils coreutils \
              gmp ncurses-libs
          fi
          # 下载器兜底：curl / wget / python3 任选其一，缺哪个都不该让 job 挂掉。
          # 三个都没有时按发行版补一个 —— 包名不能想当然：Rocky 9 只有 curl-minimal
          # （装 curl 会与它冲突，靠 --allowerasing 换掉），openEuler 有 curl、没有
          # curl-minimal ⇒ 两个都试，谁有装谁。
          # 失败不吞：装不上就把原因打出来，别让报错点离病根太远。
          if ! command -v curl >/dev/null 2>&1 &&
            ! command -v wget >/dev/null 2>&1 &&
            ! command -v python3 >/dev/null 2>&1; then
            if command -v dnf >/dev/null 2>&1; then
              dnf install -y -qq --allowerasing curl ||
                dnf install -y -qq --allowerasing curl-minimal ||
                dnf install -y -qq --allowerasing wget ||
                echo 'could not install a downloader (curl/curl-minimal/wget) on this image' >&2
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get install -y -qq curl ||
                apt-get install -y -qq wget ||
                echo 'could not install a downloader (curl/wget) on this image' >&2
            fi
          fi
          if command -v curl >/dev/null 2>&1; then
            sk_fetch() { curl -fsSL "$1" -o "$2"; }
          elif command -v wget >/dev/null 2>&1; then
            sk_fetch() { wget -qO "$2" "$1"; }
          elif command -v python3 >/dev/null 2>&1; then
            sk_fetch() { python3 -c 'import sys,urllib.request; urllib.request.urlretrieve(sys.argv[1],sys.argv[2])' "$1" "$2"; }
          else
            echo "no downloader available (curl/wget/python3)" >&2
            exit 1
          fi
          # 工具装到镜像默认 PATH 里的 /usr/local/bin，**不写 GITHUB_PATH**：
          # 实测 runner 在容器 job 里应用 GITHUB_PATH 后，下一步的 PATH 只剩
          # 追加的那一项——连 sh 都 exec 不到（issue #136 的 gate 步骤现场：
          # OCI runtime exec ... exec: "sh": executable file not found in $PATH）。
          # 容器以 root 运行；不可写时显式失败，不静默退化成「门禁跳过」。
          bin_dir=/usr/local/bin
          if [ ! -d "$bin_dir" ] || [ ! -w "$bin_dir" ]; then
            echo "$bin_dir is not writable; the compat job must run as root" >&2
            exit 1
          fi
          case "$(uname -m)" in
            arm64 | aarch64) arch=aarch64 ;;
            *) arch=x86_64 ;;
          esac
          sk_fetch "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.${arch}.tar.xz" /tmp/sc.tar.xz
          tar -xJf /tmp/sc.tar.xz -C /tmp
          install -m 0755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" "$bin_dir/shellcheck"
          case "$arch" in
            aarch64) sf="shfmt_${SHFMT_VERSION}_linux_arm64" ;;
            *) sf="shfmt_${SHFMT_VERSION}_linux_amd64" ;;
          esac
          sk_fetch "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/${sf}" "$bin_dir/shfmt"
          chmod 0755 "$bin_dir/shfmt"
          command -v shellcheck
          command -v shfmt
          bash --version | head -1

      - name: gate
        # 同样用 sh 启动；BASH 显式指向 ensure bash 解析出的可执行文件，
        # 门禁本体仍是同一份 make check（issue #136）。
        shell: sh
        run: make check BASH="$(command -v bash)"

  # bats 用例：真正独立的测试用例（每个 @test 一个进程）。
  # 不进 make check —— bats 是外部依赖；这里单独一个 job 装好再跑。
  artifact:
    name: release artifact smoke
    # v0.24.0 的教训：源码矩阵全绿、系统包构建也全绿，但真 tarball 解包后跑套件才炸
    # （漏了 .gitignore）。所以「仓库工作树能跑」必须在 PR 阶段就顺带证明「发布包能跑」：
    # 这里打包 -> 解包 -> 跑整套 -> CLI 三连，用的是发版时同一个
    # tools/package_artifact_smoke.sh，两侧不会漂移。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: build the artifacts
        run: bash tools/package_tarball.sh
      - name: smoke the artifacts
        run: bash tools/package_artifact_smoke.sh


  upgrade-matrix:
    name: cross-version upgrade matrix
    # 路线图 v0.25.0：用例都是「当前版本 → 当前版本」，证明不了老工程能不能被新版本接住。
    # 这里下载**已发布**的旧版本 tarball，用它建工程，再用当前 CLI 升级，断言：
    # 退出码 0 / vendor 里的 VERSION 跟上 / 用户文件字节不变 / 无残骸 / 再跑一次是幂等。
    # --strict：声明的每个源版本都必须真跑通（ran == 声明数、skipped == 0、
    # fails == 0）。任何跳过都判失败——跳过可能是老 CLI 不可执行/建不出工程，
    # 那是兼容性事实而不是环境噪声（issue #126）。本地离网开发可去掉 --strict。
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: run the matrix
        # --strict：一个源版本跑通、其余跳过也不允许（ran 必须等于声明数）。
        # 允许 skip 只留给本地离网开发，不是让 CI 假装覆盖了所有旧版本。
        run: bash tools/upgrade_matrix.sh --strict
  bats:
    name: bats suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: install bats
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/bats-core/bats-core/archive/refs/tags/${BATS_VERSION}.tar.gz" -o /tmp/bats.tar.gz
          tar -xzf /tmp/bats.tar.gz -C /tmp
          sudo "/tmp/bats-core-${BATS_VERSION#v}/install.sh" /usr/local
          bats --version

      - name: bats suite
        shell: bash
        run: make bats-check

  # 站点是 docs/ 的视图，构建一次就能证明同步脚本没把页面写坏、内部链接没有 404。
  # 放在独立 job 里：库的门禁不依赖 Node，本地 make check 也不该因为没装 npm 而红。
  site:
    name: docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: install
        working-directory: site
        run: npm ci --no-audit --no-fund

      - name: build
        working-directory: site
        run: npm run build

      - name: check links
        run: bash tools/site_links.sh site/.vuepress/dist

  # 覆盖率棘轮：新加了一个谁都没测的公开函数 ⇒ 红。
  # 独立 job —— 它要把整套测试在插桩副本里跑两遍（约 7 分钟），不该拖慢主矩阵的反馈。
  coverage:
    name: coverage ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: extra tooling
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext

      - name: coverage
        run: make coverage

      # TEMP: 在 ubuntu 环境重生成分支覆盖基线并上传（issue #140 编号漂移）。
      # 基线是「当前确实没被覆盖的分支臂」名单，而分支 ID 含函数内顺序号 ——
      # 改了函数里的分支就会让编号漂移，棘轮必然红。基线必须在**同环境**
      # 重生成（环境分叉臂跨机器对不上），所以这个 job 跑在 ubuntu 上。
      # 顺序：先重生成（跳过棘轮判定）再上传，最后跑常规检查（用新基线，应绿）。
      - name: rewrite branch baseline (temp)
        run: bash tools/coverage.sh --branch --write-baseline

      - name: upload rewritten baseline (temp)
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: branch-baseline-ubuntu
          path: tools/coverage_branch_baseline.txt

      # 分支级棘轮（路线图 v0.23.0「分支覆盖缺口收敛」）：基线与判据同函数级，
      # 考核范围是四条关键路径（Upgrade / Install / Skill / Repair）与 release gate。
      - name: branch coverage
        run: make coverage-branch

  # 性能基准：出报告，不阻断。
  #
  # 为什么不是硬门禁：共享 runner 的波动比代码的性能差异大得多，
  # 拿它当门禁只会变成随机红灯 —— 而随机红灯很快就会被人忽略，
  # 连「真的慢了」都看不见了。报告的价值在于看趋势。
  #
  # 基线在 tools/bench_baseline.txt（本地用 bash tools/bench.sh --write-baseline 生成）。
  bench:
    name: performance bench
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: measure
        run: bash tools/bench.sh --summary bench-summary.md

      # 计数基线检查（路线图 v0.23.0「升级热点有可比较的指标」）：xtrace 计数
      # 由代码路径决定、跨机器可比 —— 比计时稳定得多。基线 tools/bench_profile_baseline.txt
      # 在与 runner 同代的容器里用 --profile --write-baseline 生成。
      # 与计时基准同一 job：continue-on-error，出报告不阻断。
      - name: profile baseline check
        if: always()
        run: bash tools/bench.sh --profile --check

      - name: report
        if: always()
        run: cat bench-summary.md >> "$GITHUB_STEP_SUMMARY"

  # 变异测试：把语义变异种进升级路径守卫区，守卫用例必须 100% 杀灭。
  # 白名单位点是「当前无判据」的显式记录 —— 杀掉一个就该把它从 --skip 里挪走。
  mutation:
    name: mutation campaign
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: campaign
        run: make mutation
