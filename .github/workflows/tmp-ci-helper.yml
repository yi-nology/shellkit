name: tmp-ci-helper

# 临时工装（交付用，跑完就删）。
#
# 为什么需要它：本机的 gh 没有有效 token（API 401），而 SSH 推送可用。
# 于是「重生成环境相关的基线 + 开 PR + 等门禁 + 合并 + 关单」这几步
# 只能借 CI 自己的 GITHUB_TOKEN 去做。
#
# 纪律：
#   - 这个文件**只**放在 tmp/ci-helper 分支上，功能分支一行都不带
#     ⇒ 合并进 main 的树是干净的；
#   - 跑完把 tmp/ci-helper 与 tmp/ci-helper-log 两个分支删掉。

on:
  push:
    branches:
      - tmp/ci-helper

permissions:
  actions: write
  checks: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: tmp-ci-helper
  cancel-in-progress: false

jobs:
  deliver:
    name: regenerate baselines, open the PR, merge when green, close the issue
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: feat/issue-146-skeleton
      LOG_BRANCH: tmp/ci-helper-log
      ISSUE: 146
    steps:
      - name: checkout the feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BRANCH }}
          path: repo
          fetch-depth: 0

      - name: checkout the helper branch (PR body, issue comment)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: tmp/ci-helper
          path: helper

      - name: install gettext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gettext

      - name: regenerate the coverage and bench baselines (runner environment)
        run: |
          set -uo pipefail
          cd repo
          {
            echo "=== regenerate baselines on $(uname -s) $(uname -m) ==="
            bash tools/coverage.sh --write-baseline
            bash tools/coverage.sh --branch --write-baseline
            bash tools/bench.sh --profile --write-baseline
            git --no-pager diff --stat -- tools/coverage_baseline.txt tools/coverage_branch_baseline.txt tools/bench_profile_baseline.txt
          } 2>&1 | tee -a /tmp/helper.log
          exit 0

      - name: push the regenerated baselines back to the feature branch
        run: |
          set -uo pipefail
          cd repo
          if git diff --quiet -- tools/coverage_baseline.txt tools/coverage_branch_baseline.txt tools/bench_profile_baseline.txt; then
            echo "baselines unchanged" | tee -a /tmp/helper.log
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/coverage_baseline.txt tools/coverage_branch_baseline.txt tools/bench_profile_baseline.txt
            git commit -m "chore(baselines): regenerate the coverage and bench baselines on ubuntu-latest" | tee -a /tmp/helper.log
            git push origin "HEAD:$BRANCH" 2>&1 | tee -a /tmp/helper.log
          fi
          exit 0

      - name: open the pull request
        run: |
          set -uo pipefail
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "PR already exists: $(gh pr view "$BRANCH" --json number -q .number)" | tee -a /tmp/helper.log
          else
            gh pr create --base main --head "$BRANCH" \
              --title "feat(git,proc): git 领域抽象 + 进程组/看门狗原语 (#146)" \
              --body-file helper/pr-body.md 2>&1 | tee -a /tmp/helper.log
          fi
          exit 0

      - name: wait for the required checks, merge, close the issue
        run: |
          set -uo pipefail
          cd repo
          pr=$(gh pr view "$BRANCH" --json number -q .number)
          echo "PR number: $pr" | tee -a /tmp/helper.log
          merge_sha=$(git ls-remote origin "refs/pull/$pr/merge" 2>/dev/null | cut -f1)
          if [ -z "$merge_sha" ]; then
            merge_sha=$(git rev-parse HEAD)
            echo "no merge ref; falling back to the head SHA" | tee -a /tmp/helper.log
          fi
          echo "gate SHA: $merge_sha" | tee -a /tmp/helper.log
          if ! bash tools/release_gate.sh "$merge_sha" --timeout 5400 2>&1 | tee -a /tmp/helper.log; then
            echo "GATE FAILED" | tee -a /tmp/helper.log
            gh pr checks "$pr" 2>&1 | tee -a /tmp/helper.log || true
            exit 1
          fi
          echo "gate passed" | tee -a /tmp/helper.log
          if gh pr merge "$pr" --squash --delete-branch 2>&1 | tee -a /tmp/helper.log; then
            echo "merged" | tee -a /tmp/helper.log
          else
            echo "MERGE FAILED" | tee -a /tmp/helper.log
            exit 1
          fi
          {
            echo "已交付：PR #$pr（squash 合并）。"
            echo
            cat helper/issue-close.md
          } > /tmp/issue-comment.md
          gh issue close "$ISSUE" --comment "$(cat /tmp/issue-comment.md)" 2>&1 | tee -a /tmp/helper.log || true
          exit 0

      - name: publish the run log (always)
        if: always()
        run: |
          set -uo pipefail
          cd repo
          git worktree add -f /tmp/logwt -B "$LOG_BRANCH" origin/main 2>&1 | tee -a /tmp/helper.log || true
          if [ -d /tmp/logwt ]; then
            cp /tmp/helper.log /tmp/logwt/helper-log.txt 2>/dev/null || true
            cd /tmp/logwt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add helper-log.txt 2>/dev/null || true
            git commit -q -m "log: ci helper run" 2>/dev/null || true
            git push -f origin "HEAD:$LOG_BRANCH" 2>&1 | tee -a /tmp/helper.log || true
          fi
          exit 0
